footer:
  tagline: "// software with warmth"
  copy: A Cookie é uma boa menina. O Billy está a dar o seu melhor. Rocky, sai de cima do teclado, por favor. A Peggy sabe.

home:
  hero_title_html: Software <em>no ponto</em>,<br>saído do forno.
  hero_sub: A CookieBytes cria produtos digitais com carinho, precisão e um pouco de amor — como as melhores bolachas caseiras. Resultados doces, zero migalhas.
  start_project: Começar um projeto
  meet_team: Conhecer a equipa →
  dog_strip_html: Movidos a código, cafeína e <strong>4 animais</strong> que mandam nisto tudo
  services_label: "// o que sai do forno"
  services_title: Sabores full-stack para todos os apetites.
  services_desc: De MVPs estaladiços a plataformas empresariais com várias camadas — criamos software que sabe exatamente como deve saber.
  services:
    - { icon: "📱", bg: "#D4EDEA", title: "Apps Móveis", text: "Experiências móveis com qualidade nativa para iOS e Android. Interações fluidas, offline-first e prontas para escalar." }
    - { icon: "🔧", bg: "#FDF0E0", title: "API & Backend", text: "APIs e sistemas de backend robustos e bem documentados. Feitos para a fiabilidade, a segurança e o tipo de uptime que o deixa dormir descansado." }
    - { icon: "🎨", bg: "#FFF4E0", title: "Design de Produto", text: "UX e UI com personalidade. Desenhamos interfaces que parecem humanas — intuitivas, acolhedoras e às quais apetece voltar." }
    - { icon: "🚀", bg: "#E8F5EE", title: "DevOps & Escala", text: "CI/CD, contentores e arquitetura cloud. Pomos o seu código em produção de forma limpa e mantemo-lo a funcionar com qualquer carga." }
    - { icon: "🏗️", bg: "#EEF2FF", title: "Infraestrutura", text: "Do provisionamento na cloud a instalações on-premise, desenhamos e gerimos infraestrutura resiliente, eficiente em custos e pronta para crescer consigo." }
    - { icon: "🌐", bg: "#FDF4FF", title: "Redes", text: "Desenho e gestão de redes seguras e de alto desempenho. Garantimos que os seus sistemas comunicam entre si com fiabilidade — e que os errados não." }
    - { icon: "🏠", bg: "#FFEEDD", title: "Domótica", text: "Casas inteligentes, integrações IoT e instalações de Home Assistant. Pomos o seu espaço a responder-lhe — luzes, sensores e rotinas, tudo em sintonia." }
  about_label: "// a nossa história"
  about_title: Batizada por animais. Feita para durar.
  about_p1: "A CookieBytes começou com duas coisas: o gosto por código limpo e uma cadela chamada Cookie. As bolachas? Representam carinho, cuidado e a satisfação de algo feito no ponto. Os bytes? São toda a magia do software a acontecer nos bastidores."
  about_p2: Depois chegou o Billy, o Rocky começou a atirar coisas das prateleiras abaixo e a Peggy passou a julgar as code reviews de toda a gente. Somos um estúdio pequeno e focado — sem excessos, sem floreados e com quatro animais que claramente mandam nisto.
  crew_divider: 🐾 A equipa
  crew:
    - { key: cookie, emoji: "🐕", name: "Cookie", text: "A original. Calma, fiável e profundamente envolvida em todas as decisões de produto. Nunca faltou a uma standup.", role: "Diretora de Felicidade" }
    - { key: billy, emoji: "🐶", name: "Billy", text: "Chegou como uma bola de demolição e ainda não abrandou. Responsável por 3 pivots, 2 rebrands e um teclado que não sobreviveu.", role: "Diretor de Disrupção" }
    - { key: rocky, emoji: "🐱", name: "Rocky", text: "Trata cada sprint como um parque infantil. Já apagou dois ficheiros do Figma, uma configuração de produção e meia sandes.", role: "Engenheiro-Chefe do Caos" }
    - { key: peggy, emoji: "🐈", name: "Peggy", text: "Observa. Pensa. Julga em silêncio. O feedback dela é raro, mas devastador. A equipa aprendeu a levá-lo a sério.", role: "Diretora de Revisões Mudas" }
  stat_label: Guloseimas diárias — divididas em partes iguais, negociadas todos os dias, contestadas sempre
  contact_title: Vamos pôr algo bom no forno?
  contact_text: Fale-nos do seu projeto. Nós trazemos a manteiga, você traz a ideia.
