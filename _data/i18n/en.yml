home:
  hero_title_html: Software that's <em>baked</em><br>to perfection.
  hero_sub: CookieBytes builds digital products with warmth, precision, and a little love — just like the best homemade cookies. Sweet results, zero crumbs.
  start_project: Start a project
  meet_team: Meet the team →
  dog_strip_html: Powered by code, caffeine, and <strong>4 animals</strong> who run the place
  services_label: "// what we bake"
  services_title: Full-stack flavours for every appetite.
  services_desc: From crispy MVPs to layered enterprise platforms — we craft software that feels exactly right.
  services:
    - { icon: "📱", bg: "#D4EDEA", title: "Mobile Apps", text: "Native-quality mobile experiences for iOS and Android. Smooth interactions, offline-first, and ready for scale." }
    - { icon: "🔧", bg: "#FDF0E0", title: "API & Backend", text: "Robust, well-documented APIs and backend systems. Built for reliability, security, and the kind of uptime that lets you sleep at night." }
    - { icon: "🎨", bg: "#FFF4E0", title: "Product Design", text: "UX and UI with personality. We design interfaces that feel human — intuitive, warm, and worth coming back to." }
    - { icon: "🚀", bg: "#E8F5EE", title: "DevOps & Scale", text: "CI/CD, containerization, and cloud architecture. We get your code shipped cleanly and keep it running at any load." }
    - { icon: "🏗️", bg: "#EEF2FF", title: "Infrastructure", text: "From cloud provisioning to on-premise setups, we design and manage infrastructure that's resilient, cost-efficient, and built to grow with you." }
    - { icon: "🌐", bg: "#FDF4FF", title: "Network", text: "Secure, high-performance network design and management. We make sure your systems talk to each other reliably — and that the wrong ones don't." }
    - { icon: "🏠", bg: "#FFEEDD", title: "Home Automation", text: "Smart-home installs, IoT integrations, and Home Assistant setups. We make your space respond to you — lights, sensors, routines, all in sync." }
  about_label: "// our story"
  about_title: Named after animals. Built for the long run.
  about_p1: "CookieBytes started with two things: a love of clean code and a dog named Cookie. The cookies? They represent warmth, care, and the satisfaction of something made just right. Bytes? That's all the software magic happening behind the scenes."
  about_p2: Then Billy joined, Rocky knocked things off shelves, and Peggy started judging everyone's code reviews. We're a small, focused studio — no bloat, no fluff, and four animals who definitely run the place.
  crew_divider: 🐾 The crew
  crew:
    - { key: cookie, emoji: "🐕", name: "Cookie", text: "The original. Calm, dependable, and deeply invested in every product decision. Has never missed a standup.", role: "Chief Happiness Officer" }
    - { key: billy, emoji: "🐶", name: "Billy", text: "Joined like a wrecking ball and hasn't slowed down. Responsible for 3 pivots, 2 rebrands, and one keyboard that didn't survive.", role: "Chief Disruption Officer" }
    - { key: rocky, emoji: "🐱", name: "Rocky", text: "Treats every sprint like a playground. Has personally deleted two Figma files, one production config, and half a sandwich.", role: "Head of Chaos Engineering" }
    - { key: peggy, emoji: "🐈", name: "Peggy", text: "Watches. Thinks. Judges silently. Her feedback is rare but devastating. The team has learned to take it seriously.", role: "Director of Silent Reviews" }
  stat_label: Daily treats — split evenly, negotiated daily, disputed always
